<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Museum Check List</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --card: #151e2e;
      --border: #2a3649;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3b9eff;
      --ok: #00B050;
      --fail: #FF0000;
      --notresp: #FFC000;
      --col-no: 28px;
      --col-ex: 124px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background: #101827;
      border-bottom: 1px solid var(--border);
      padding: 0.22rem 0.5rem;
    }
    .header-inner {
      max-width: 1760px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.22rem 0.5rem;
    }
    .brand { display: flex; align-items: center; gap: 0.38rem; min-width: 0; }
    .logo {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, #3b9eff, #2563eb);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; flex-shrink: 0;
    }
    h1 { font-size: 0.92rem; font-weight: 700; line-height: 1.1; }
    h1 span { color: #60a5fa; }
    .meta { font-size: 0.6rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 78vw; }
    .tabs {
      display: flex; gap: 0.1rem;
      background: var(--card);
      padding: 0.08rem;
      border-radius: 0.38rem;
      border: 1px solid var(--border);
      overflow-x: auto;
      max-width: 100%;
    }
    .tab {
      padding: 0.18rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.7rem;
      border-radius: 0.28rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active { background: var(--accent); color: #fff; }
    main {
      max-width: 1760px;
      margin: 0 auto;
      padding: 0.22rem 0.5rem 0.28rem;
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 44px);
    }
    .summary {
      display: flex;
      gap: 0.22rem;
      margin-bottom: 0.18rem;
      flex-shrink: 0;
    }
    .summary-card {
      flex: 1;
      border-radius: 0.28rem;
      padding: 0.1rem 0.35rem;
      min-width: 0;
      background: var(--card);
      line-height: 1.05;
    }
    .summary-card .label {
      font-size: 0.5rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .summary-card .value { font-size: 0.86rem; font-weight: 800; }
    .summary-card.ok { background: var(--ok); color: #fff; }
    .summary-card.ok .label { color: #e9ffe9; }
    .summary-card.fail { background: var(--fail); color: #fff; }
    .summary-card.fail .label { color: #ffeaea; }
    .summary-card.issues { background: var(--notresp); color: #1a1400; }
    .summary-card.issues .label { color: #5a3a00; }
    .summary-card.today-issues {
      background: linear-gradient(135deg, #FFC000, #FFD84D);
      color: #1a1400;
      border: 2px solid #FFA500;
    }
    .summary-card.today-issues .label { color: #5a3a00; }
    .legend {
      display: flex; flex-wrap: wrap;
      gap: 0.14rem 0.5rem;
      margin-bottom: 0.16rem;
      font-size: 0.6rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .legend-item { display: flex; align-items: center; gap: 0.18rem; }
    .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .table-wrap {
      flex: 1;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.38rem;
      overflow: hidden;
    }
    .table-scroll { overflow: auto; height: 100%; width: 100%; }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.68rem;
    }
    th, td {
      padding: 0.14rem 0.18rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid rgba(42, 54, 73, 0.75);
      white-space: nowrap;
      min-width: 22px;
    }
    th {
      background: #0d1522;
      color: var(--muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.62rem;
    }
    /* Highlight today's column - ONLY border, no background override */
    th.today-col {
      border-top: 3px solid var(--accent);
      border-bottom: 3px solid var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    td.today-col {
      border-top: 1px solid rgba(59, 158, 255, 0.4);
      border-bottom: 1px solid rgba(59, 158, 255, 0.4);
    }
    th:nth-child(1), td:nth-child(1) {
      position: sticky; left: 0; z-index: 6;
      background: var(--card); text-align: left;
      width: var(--col-no); min-width: var(--col-no); max-width: var(--col-no);
      font-weight: 600;
    }
    th:nth-child(2), td:nth-child(2) {
      position: sticky; left: var(--col-no); z-index: 6;
      background: var(--card); text-align: left;
      width: var(--col-ex); min-width: var(--col-ex); max-width: var(--col-ex);
      overflow: hidden; text-overflow: ellipsis;
      font-weight: 500;
    }
    th:nth-child(3), td:nth-child(3) {
      text-align: left;
      min-width: 38px; max-width: 42px;
      color: var(--muted); font-size: 0.62rem;
    }
    th:nth-child(1), th:nth-child(2) { background: #0d1522; z-index: 16; }
    tr:hover td:nth-child(1), tr:hover td:nth-child(2) { background: #1a2435; }
    tr.results-row td { font-weight: 700; }
    .loading { text-align: center; padding: 2rem 1rem; color: var(--muted); }
    .error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.8rem 1rem;
      border-radius: 0.5rem;
    }
    @media (max-width: 700px) {
      :root { --col-no: 22px; --col-ex: 92px; }
      header { padding: 0.16rem 0.28rem; }
      main { padding: 0.16rem 0.28rem 0.2rem; height: calc(100dvh - 38px); }
      h1 { font-size: 0.8rem; }
      .logo { width: 20px; height: 20px; font-size: 0.7rem; }
      .meta { font-size: 0.52rem; }
      .tabs { width: 100%; }
      .tab { padding: 0.16rem 0.4rem; font-size: 0.64rem; }
      .summary { gap: 0.14rem; flex-wrap: wrap; }
      .summary-card { padding: 0.06rem 0.2rem; min-width: 30%; }
      .summary-card .label { font-size: 0.44rem; }
      .summary-card .value { font-size: 0.74rem; }
      .legend { font-size: 0.52rem; gap: 0.1rem 0.38rem; }
      th, td { padding: 0.1rem 0.1rem; font-size: 0.58rem; min-width: 18px; }
      th:nth-child(3), td:nth-child(3) { min-width: 30px; max-width: 34px; }
    }
    /* Login styles */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 1rem;
    }
    .login-logo .logo-large {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .login-logo h2 {
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .login-logo p {
      color: var(--muted);
      font-size: 0.7rem;
      margin-bottom: 0.5rem;
    }
    .login-input {
      width: 100%;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.38rem;
      background: #0d1522;
      color: var(--text);
      font-size: 0.75rem;
      outline: none;
    }
    .login-input:focus {
      border-color: var(--accent);
    }
    .login-btn {
      width: 100%;
      padding: 0.55rem;
      background: var(--accent);
      border: none;
      border-radius: 0.38rem;
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover {
      opacity: 0.9;
    }
    .login-error {
      color: #fca5a5;
      font-size: 0.65rem;
      margin-top: 0.4rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Login Overlay -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-large">🏛️</div>
        <h2>KAUST Museum</h2>
        <h3 style="font-size:0.9rem; margin-bottom:0.2rem;">Check List</h3>
        <p>More interesting technical information there.</p>
        <p style="color:var(--muted); font-size:0.65rem; word-break:break-all;">📧 thakursaajid@gmail.com</p>
      </div>
      <form id="login-form">
        <input type="text" class="login-input" id="login-user" value="Thakur_Saajid" readonly style="opacity:0.7; cursor:not-allowed;">
        <input type="text" class="login-input" id="login-pass" placeholder="KAUST ID" required autofocus>
        <button type="submit" class="login-btn">🔒 Login</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="logo">🏛️</div>
        <div>
          <h1>Museum <span>Check List</span></h1>
          <div class="meta" id="last-updated">Loading...</div>
        </div>
      </div>
      <div class="tabs" id="sheet-tabs"></div>
    </div>
  </header>
  <main>
    <div class="summary" id="summary"></div>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#00B050"></span> OK</div>
      <div class="legend-item"><span class="dot" style="background:#FF0000"></span> Failed</div>
      <div class="legend-item"><span class="dot" style="background:#00B0F0"></span> Hang</div>
      <div class="legend-item"><span class="dot" style="background:#0070C0"></span> Flickering</div>
      <div class="legend-item"><span class="dot" style="background:#FFC000"></span> Not Respond</div>
      <div class="legend-item"><span class="dot" style="background:#FFFF00"></span> Weekend</div>
    </div>
    <div id="content" class="table-wrap">
      <div class="loading">Loading checklist...</div>
    </div>
  </main>

  <script>
    const FILE_URL = 'Museum_Check_List.xlsx';
    const FROM_LABEL = 'thakursaajid@gmail.com';
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    let data = null;
    let currentSheet = null;
    let isLoggedIn = false;

    // Login handling
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    
    const VALID_USER = 'Thakur_Saajid';
    const VALID_PASS = '105475';

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      
      if (user === VALID_USER && pass === VALID_PASS) {
        isLoggedIn = true;
        document.getElementById('login-overlay').style.display = 'none';
        start();
      } else {
        loginError.textContent = 'Invalid KAUST ID';
        document.getElementById('login-pass').value = '';
        document.getElementById('login-pass').focus();
      }
    });

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function nsTag(el, name) { return el.getElementsByTagNameNS('*', name); }

    function colRowFromRef(ref) {
      const m = String(ref).match(/^([A-Z]+)(\d+)$/i);
      if (!m) return { col: 1, row: 1 };
      const letters = m[1].toUpperCase();
      let col = 0;
      for (let i = 0; i < letters.length; i++) col = col * 26 + (letters.charCodeAt(i) - 64);
      return { col, row: parseInt(m[2], 10) };
    }

    function rgbToCss(rgb) {
      if (!rgb) return null;
      rgb = rgb.replace('#', '').toUpperCase();
      if (rgb.length === 8) rgb = rgb.slice(2);
      if (rgb.length !== 6) return null;
      return '#' + rgb;
    }

    function hexParts(f) {
      let x = String(f || '').toUpperCase().replace('#', '');
      if (x.length === 8) x = x.slice(2);
      if (x.length !== 6) return null;
      return {
        r: parseInt(x.slice(0, 2), 16),
        g: parseInt(x.slice(2, 4), 16),
        b: parseInt(x.slice(4, 6), 16)
      };
    }

    function classifyFill(f) {
      const p = hexParts(f);
      if (!p) return null;
      if (p.r > 200 && p.g > 200 && p.b < 90) return 'weekend';
      if (p.g > p.r + 15 && p.g > p.b + 15 && p.g > 90) return 'ok';
      if (p.r > 180 && p.g < 90 && p.b < 90) return 'failed';
      if (p.b > 180 && p.g > 140 && p.r < 90) return 'hang';
      if (p.b > 140 && p.r < 90 && p.g < 140) return 'flicker';
      if (p.r > 160 && p.g > 50 && p.g < 210 && p.b < 90) return 'notresp';
      return null;
    }

    function parseFills(stylesXml) {
      const doc = new DOMParser().parseFromString(stylesXml, 'application/xml');
      const fills = [];
      const fillNodes = nsTag(doc, 'fill');
      for (let i = 0; i < fillNodes.length; i++) {
        const pf = nsTag(fillNodes[i], 'patternFill')[0];
        if (!pf) { fills.push(null); continue; }
        if (pf.getAttribute('patternType') !== 'solid') { fills.push(null); continue; }
        const fg = nsTag(pf, 'fgColor')[0];
        fills.push(fg ? rgbToCss(fg.getAttribute('rgb')) : null);
      }
      const xfs = [];
      const xfParent = nsTag(doc, 'cellXfs')[0];
      const xfNodes = xfParent ? nsTag(xfParent, 'xf') : [];
      for (let i = 0; i < xfNodes.length; i++) {
        xfs.push(fills[parseInt(xfNodes[i].getAttribute('fillId') || '0', 10)] || null);
      }
      return xfs;
    }

    function parseSharedStrings(xml) {
      if (!xml) return [];
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const sis = nsTag(doc, 'si');
      const out = [];
      for (let i = 0; i < sis.length; i++) {
        const texts = nsTag(sis[i], 't');
        let s = '';
        for (let j = 0; j < texts.length; j++) s += texts[j].textContent || '';
        out.push(s);
      }
      return out;
    }

    function parseSheet(xml, shared, xfs) {
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const cells = nsTag(doc, 'c');
      const grid = {};
      let maxRow = 0, maxCol = 0;
      for (let i = 0; i < cells.length; i++) {
        const c = cells[i];
        const ref = c.getAttribute('r');
        if (!ref) continue;
        const { col, row } = colRowFromRef(ref);
        const t = c.getAttribute('t');
        const s = c.getAttribute('s');
        const vNode = nsTag(c, 'v')[0];
        const isNode = nsTag(c, 'is')[0];
        let value = null;
        if (t === 's' && vNode) value = shared[parseInt(vNode.textContent, 10)] ?? '';
        else if (t === 'inlineStr' && isNode) {
          const ts = nsTag(isNode, 't');
          value = Array.from(ts).map(n => n.textContent || '').join('');
        } else if (vNode) value = vNode.textContent;
        const fill = s != null ? (xfs[parseInt(s, 10)] || null) : null;
        if ((value != null && value !== '') || fill) {
          grid[row + ':' + col] = { value, fill };
          if (row > maxRow) maxRow = row;
          if (col > maxCol) maxCol = col;
        }
      }
      return { grid, maxRow, maxCol };
    }

    function sheetToView(parsed) {
      const { grid, maxRow, maxCol } = parsed;
      let headerRow = 3;
      for (let r = 1; r <= Math.min(8, maxRow); r++) {
        if ((grid[r + ':1'] || {}).value === 'No.') { headerRow = r; break; }
      }
      let lastCol = 3;
      for (let c = 1; c <= maxCol; c++) {
        const v = (grid[headerRow + ':' + c] || {}).value;
        if (v != null && v !== '') lastCol = c;
      }
      const headers = [];
      for (let c = 1; c <= lastCol; c++) {
        const cell = grid[headerRow + ':' + c] || {};
        headers.push({ value: cell.value == null ? '' : cell.value, fill: cell.fill || null });
      }
      const rows = [];
      for (let r = headerRow + 1; r <= maxRow; r++) {
        const cells = [];
        let has = false;
        for (let c = 1; c <= lastCol; c++) {
          const cell = grid[r + ':' + c] || {};
          const value = cell.value == null ? '' : cell.value;
          const fill = cell.fill || null;
          if (value !== '' || fill) has = true;
          cells.push({ value, fill });
        }
        const joined = cells.slice(0, 3).map(x => String(x.value).toLowerCase()).join(' ');
        if (joined.indexOf('results') !== -1) {
          rows.push({ cells, is_results: true });
          continue;
        }
        if (has && String(cells[0].value).trim() !== '') rows.push({ cells, is_results: false });
      }
      return { headers, rows };
    }

    async function loadExcel() {
      const resp = await fetch(FILE_URL + '?t=' + Date.now());
      if (!resp.ok) throw new Error('Could not load Excel file');
      const buf = await resp.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      const wbXml = await zip.file('xl/workbook.xml').async('string');
      const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
      const stylesXml = await zip.file('xl/styles.xml').async('string');
      const ssFile = zip.file('xl/sharedStrings.xml');
      const shared = ssFile ? parseSharedStrings(await ssFile.async('string')) : [];
      const xfs = parseFills(stylesXml);
      const relDoc = new DOMParser().parseFromString(relsXml, 'application/xml');
      const relMap = {};
      const rels = nsTag(relDoc, 'Relationship');
      for (let i = 0; i < rels.length; i++) {
        relMap[rels[i].getAttribute('Id')] = rels[i].getAttribute('Target');
      }
      const wbDoc = new DOMParser().parseFromString(wbXml, 'application/xml');
      const sheets = nsTag(wbDoc, 'sheet');
      const result = {};
      for (let i = 0; i < sheets.length; i++) {
        const name = sheets[i].getAttribute('name');
        const rid = sheets[i].getAttribute('r:id') || sheets[i].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
        let target = relMap[rid];
        if (!target) continue;
        if (target.startsWith('/')) target = target.slice(1);
        if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\/?/, '');
        result[name] = sheetToView(parseSheet(await zip.file(target).async('string'), shared, xfs));
      }
      return { result, lastMod: resp.headers.get('Last-Modified') };
    }

    function countStatuses(sheet) {
      const counts = { ok: 0, failed: 0, hang: 0, flicker: 0, notresp: 0, total: 0, todayIssues: 0 };
      const today = new Date().getDate();
      
      sheet.rows.forEach(row => {
        if (row.is_results) {
          row.cells.forEach((cell, idx) => {
            if (idx < 3) return;
            if (classifyFill(cell.fill) === 'ok') counts.ok++;
          });
          return;
        }
        counts.total++;
        row.cells.forEach((cell, idx) => {
          if (idx < 3) return;
          const k = classifyFill(cell.fill);
          if (k === 'failed') counts.failed++;
          else if (k === 'hang') counts.hang++;
          else if (k === 'flicker') counts.flicker++;
          else if (k === 'notresp') counts.notresp++;
          
          const colDate = idx - 2;
          if (colDate === today && (k === 'failed' || k === 'hang' || k === 'flicker' || k === 'notresp')) {
            counts.todayIssues++;
          }
        });
      });
      return counts;
    }

    function card(cls, label, value) {
      return '<div class="summary-card ' + cls + '"><div class="label">' + label +
        '</div><div class="value">' + value + '</div></div>';
    }

    function renderSummary(sheetName) {
      const sheet = data[sheetName];
      const c = countStatuses(sheet);
      const days = Math.max(0, (sheet.headers.length || 3) - 3);
      document.getElementById('summary').innerHTML =
        card('', 'Exhibits', c.total) +
        card('', 'Days', days) +
        card('today-issues', 'Today Issues', c.todayIssues) +
        card('ok', 'OK', c.ok) +
        card('fail', 'Failed', c.failed) +
        card('issues', 'Issues', c.hang + c.flicker + c.notresp);
    }

    function headerLabel(h, idx) {
      const v = String(h.value || '');
      if (idx === 2 || /server/i.test(v)) return 'Addr';
      return v;
    }

    function renderSheet(sheetName) {
      const sheet = data[sheetName];
      if (!sheet) return;
      currentSheet = sheetName;
      renderSummary(sheetName);
      
      const today = new Date().getDate();
      
      let html = '<div class="table-scroll"><table><thead><tr>';
      sheet.headers.forEach((h, idx) => {
        // Preserve Excel background color
        const style = h.fill ? 'background:' + h.fill + ';color:#111;font-weight:700;' : '';
        const isToday = idx >= 3 && idx - 2 === today;
        const todayClass = isToday ? ' class="today-col"' : '';
        html += '<th' + todayClass + ' style="' + style + '">' + escapeHtml(headerLabel(h, idx)) + '</th>';
      });
      html += '</tr></thead><tbody>';
      sheet.rows.forEach(row => {
        html += '<tr' + (row.is_results ? ' class="results-row"' : '') + '>';
        row.cells.forEach((cell, idx) => {
          // Preserve Excel background color
          const style = cell.fill ? 'background:' + cell.fill + ';color:#111;font-weight:600;' : '';
          const isToday = idx >= 3 && idx - 2 === today;
          const todayClass = isToday ? ' class="today-col"' : '';
          html += '<td' + todayClass + ' style="' + style + '">' + escapeHtml(cell.value) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('content').innerHTML = html;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.sheet === sheetName);
      });
    }

    async function loadFromGoogle(url) {
      try {
        const resp = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now());
        if (resp.ok) {
          const json = await resp.json();
          return { result: json.sheets || json, lastMod: json.lastUpdated || null };
        }
      } catch (e) {}
      const json = await loadJsonp(url);
      return { result: json.sheets || json, lastMod: json.lastUpdated || null };
    }

    function loadJsonp(url) {
      return new Promise((resolve, reject) => {
        const cbName = 'checklistCb_' + Date.now();
        const timer = setTimeout(() => reject(new Error('Google Sheets timeout')), 20000);
        window[cbName] = function (json) {
          clearTimeout(timer);
          delete window[cbName];
          script.remove();
          resolve(json);
        };
        const script = document.createElement('script');
        script.onerror = function () {
          clearTimeout(timer);
          reject(new Error('Failed to load data'));
        };
        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cbName;
        document.body.appendChild(script);
      });
    }

    function pickDefaultSheet(names) {
      if (currentSheet && names.indexOf(currentSheet) >= 0) return currentSheet;
      const now = MONTHS[new Date().getMonth()];
      return names.find(n => n.toLowerCase() === now.toLowerCase()) || names[0];
    }

    function setMeta(lastMod) {
      const d = lastMod ? new Date(lastMod) : new Date();
      const when = isNaN(d.getTime()) ? new Date().toLocaleString() : d.toLocaleString();
      document.getElementById('last-updated').textContent = 'From ' + FROM_LABEL + ' • ' + when;
    }

    async function loadAll() {
      const googleUrl = (window.CHECKLIST_CONFIG && window.CHECKLIST_CONFIG.googleScriptUrl || '').trim();
      let result, lastMod;
      if (googleUrl) ({ result, lastMod } = await loadFromGoogle(googleUrl));
      else ({ result, lastMod } = await loadExcel());
      data = result;
      setMeta(lastMod);
      const names = Object.keys(data);
      const tabsEl = document.getElementById('sheet-tabs');
      tabsEl.innerHTML = '';
      names.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.textContent = name;
        btn.dataset.sheet = name;
        btn.onclick = () => renderSheet(name);
        tabsEl.appendChild(btn);
      });
      if (names.length) renderSheet(pickDefaultSheet(names));
    }

    async function start() {
      try {
        await loadAll();
        setInterval(function () { loadAll().catch(function () {}); }, 60000);
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="error"><strong>Error</strong><br>' + escapeHtml(err.message) + '</div>';
        document.getElementById('last-updated').textContent = 'Failed to load';
      }
    }
    // Do NOT auto-start - wait for login
    // start();
  </script>
</body>
