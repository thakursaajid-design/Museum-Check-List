<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum Check List</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1700px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h1 span { color: var(--accent); }

    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }

    .tabs {
      display: flex;
      gap: 0.4rem;
      background: var(--card);
      padding: 0.3rem;
      border-radius: 0.65rem;
      border: 1px solid var(--border);
    }

    .tab {
      padding: 0.4rem 1.1rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 0.45rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .tab.active { background: var(--accent); color: #0f172a; }

    main {
      max-width: 1700px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .table-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .table-scroll {
      overflow-x: auto;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      min-width: 900px;
    }

    th, td {
      padding: 0.38rem 0.4rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid rgba(51, 65, 85, 0.45);
      white-space: nowrap;
      min-width: 28px;
    }

    th {
      background: #0f172a;
      color: var(--muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* Sticky first 3 columns */
    th:nth-child(1), td:nth-child(1) {
      position: sticky; left: 0; z-index: 5;
      background: var(--card); text-align: left; min-width: 36px;
    }
    th:nth-child(2), td:nth-child(2) {
      position: sticky; left: 36px; z-index: 5;
      background: var(--card); text-align: left; min-width: 135px; max-width: 160px;
      white-space: normal;
    }
    th:nth-child(3), td:nth-child(3) {
      position: sticky; left: 171px; z-index: 5;
      background: var(--card); text-align: left; min-width: 68px;
    }
    th:nth-child(1), th:nth-child(2), th:nth-child(3) {
      background: #0f172a; z-index: 15;
    }

    tr:hover td { background: rgba(56, 189, 248, 0.06); }
    tr:hover td:nth-child(1),
    tr:hover td:nth-child(2),
    tr:hover td:nth-child(3) { background: #1e293b; }

    tr.results-row td {
      background: rgba(34, 197, 94, 0.08);
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 1rem 1.25rem;
      border-radius: 0.5rem;
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      color: var(--muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      margin-top: 1.5rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 0.45rem;
      font-size: 0.82rem;
      text-decoration: none;
      transition: all 0.15s;
    }
    .download-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.15rem; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      main { padding: 0.85rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>🏛️ Museum <span>Check List</span></h1>
        <div class="meta" id="last-updated">Loading...</div>
      </div>
      <div style="display:flex; align-items:center; gap:0.85rem; flex-wrap:wrap;">
        <div class="tabs" id="sheet-tabs"></div>
        <a class="download-btn" href="Museum_Check_List.xlsx" download>
          ⬇️ Download Excel
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#00B050"></span> OK</div>
      <div class="legend-item"><span class="dot" style="background:#FF0000"></span> Failed</div>
      <div class="legend-item"><span class="dot" style="background:#00B0F0"></span> Hang</div>
      <div class="legend-item"><span class="dot" style="background:#0070C0"></span> Connectivity</div>
      <div class="legend-item"><span class="dot" style="background:#FFC000"></span> Not Respond</div>
      <div class="legend-item"><span class="dot" style="background:#FFFF00"></span> Weekend / Highlight</div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        Loading checklist...
      </div>
    </div>
  </main>

  <footer>
    Read-only view • Colors and highlights match the Excel file
  </footer>

  <script>
    let data = null;

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSheet(sheetName) {
      const sheet = data[sheetName];
      if (!sheet) return;

      const { headers, rows } = sheet;

      let html = '<div class="table-wrapper"><div class="table-scroll"><table><thead><tr>';

      headers.forEach((h) => {
        let style = '';
        if (h.fill) {
          style = 'background:' + h.fill + ';color:#000;font-weight:700;';
        }
        const label = h.value == null ? '' : h.value;
        html += '<th style="' + style + '">' + escapeHtml(label) + '</th>';
      });
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        const cls = row.is_results ? ' class="results-row"' : '';
        html += '<tr' + cls + '>';
        row.cells.forEach((cell) => {
          let style = '';
          if (cell.fill) {
            style = 'background:' + cell.fill + ';color:#000;font-weight:600;';
          }
          const val = cell.value == null ? '' : cell.value;
          html += '<td style="' + style + '">' + escapeHtml(val) + '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div></div>';
      document.getElementById('content').innerHTML = html;

      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.sheet === sheetName);
      });
    }

    async function loadData() {
      try {
        const resp = await fetch('data.json?t=' + Date.now());
        if (!resp.ok) throw new Error('Failed to load data.json');
        data = await resp.json();

        document.getElementById('last-updated').textContent =
          'Last updated: ' + new Date().toLocaleString();

        const tabsEl = document.getElementById('sheet-tabs');
        tabsEl.innerHTML = '';
        const sheetNames = Object.keys(data);
        sheetNames.forEach((name, i) => {
          const btn = document.createElement('button');
          btn.className = 'tab' + (i === 0 ? ' active' : '');
          btn.textContent = name;
          btn.dataset.sheet = name;
          btn.onclick = () => renderSheet(name);
          tabsEl.appendChild(btn);
        });

        if (sheetNames.length > 0) {
          renderSheet(sheetNames[0]);
        }
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="error"><strong>Error</strong><br>' + escapeHtml(err.message) + '</div>';
      }
    }

    loadData();
  </script>
</body>
</html>
