<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum Check List</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --card: #151e2e;
      --border: #2a3649;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3b9eff;
      --accent2: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .top-bar {
      height: 3px;
      background: linear-gradient(90deg, #3b9eff, #22c55e, #f59e0b, #ef4444);
    }
    header {
      background: linear-gradient(180deg, #121a29 0%, #0f1623 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 1.5rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .header-inner {
      max-width: 1700px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .logo {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #3b9eff, #2563eb);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 12px rgba(59, 158, 255, 0.35);
    }
    h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    h1 span { color: var(--accent2); }
    .meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
    .header-right { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
    .tabs {
      display: flex; gap: 0.3rem; flex-wrap: wrap;
      background: var(--card);
      padding: 0.28rem;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
    }
    .tab {
      padding: 0.42rem 1.05rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.84rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 158, 255, 0.4);
    }
    .download-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.95rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
    }
    .download-btn:hover {
      border-color: var(--accent);
      color: var(--accent2);
    }
    main { max-width: 1700px; margin: 0 auto; padding: 1.35rem 1.5rem 2rem; }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      padding: 0.85rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .summary-card .icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .summary-card .label {
      font-size: 0.72rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .summary-card .value { font-size: 1.25rem; font-weight: 700; }
    .legend {
      display: flex; flex-wrap: wrap;
      gap: 0.9rem 1.25rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .dot {
      width: 11px; height: 11px; border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .table-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    }
    .table-scroll {
      overflow-x: auto;
      max-height: calc(100vh - 280px);
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.77rem;
      min-width: 900px;
    }
    th, td {
      padding: 0.4rem 0.42rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid rgba(42, 54, 73, 0.7);
      white-space: nowrap;
      min-width: 28px;
    }
    th {
      background: #0d1522;
      color: var(--muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.75rem;
    }
    th:nth-child(1), td:nth-child(1) {
      position: sticky; left: 0; z-index: 5;
      background: var(--card); text-align: left; min-width: 38px; font-weight: 600;
    }
    th:nth-child(2), td:nth-child(2) {
      position: sticky; left: 38px; z-index: 5;
      background: var(--card); text-align: left; min-width: 138px; max-width: 165px;
      white-space: normal; font-weight: 500;
    }
    th:nth-child(3), td:nth-child(3) {
      position: sticky; left: 176px; z-index: 5;
      background: var(--card); text-align: left; min-width: 72px;
      color: var(--muted); font-size: 0.74rem;
    }
    th:nth-child(1), th:nth-child(2), th:nth-child(3) {
      background: #0d1522; z-index: 15;
    }
    tr:hover td { background: rgba(59, 158, 255, 0.05); }
    tr:hover td:nth-child(1),
    tr:hover td:nth-child(2),
    tr:hover td:nth-child(3) { background: #1a2435; }
    tr.results-row td { background: rgba(34, 197, 94, 0.07); font-weight: 600; }
    .loading { text-align: center; padding: 4.5rem 1rem; color: var(--muted); }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 1rem 1.25rem;
      border-radius: 0.6rem;
    }
    footer {
      text-align: center;
      padding: 1.4rem;
      color: var(--muted);
      font-size: 0.76rem;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 700px) {
      h1 { font-size: 1.15rem; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="top-bar"></div>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="logo">🏛️</div>
        <div>
          <h1>Museum <span>Check List</span></h1>
          <div class="meta" id="last-updated">Loading...</div>
        </div>
      </div>
      <div class="header-right">
        <div class="tabs" id="sheet-tabs"></div>
        <a class="download-btn" href="Museum_Check_List.xlsx" download>Download Excel</a>
      </div>
    </div>
  </header>
  <main>
    <div class="summary" id="summary"></div>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#00B050"></span> OK</div>
      <div class="legend-item"><span class="dot" style="background:#FF0000"></span> Failed</div>
      <div class="legend-item"><span class="dot" style="background:#00B0F0"></span> Hang</div>
      <div class="legend-item"><span class="dot" style="background:#0070C0"></span> Connectivity</div>
      <div class="legend-item"><span class="dot" style="background:#FFC000"></span> Not Respond</div>
      <div class="legend-item"><span class="dot" style="background:#FFFF00"></span> Weekend / Highlight</div>
    </div>
    <div id="content">
      <div class="loading"><div class="spinner"></div>Loading checklist...</div>
    </div>
  </main>
  <footer>Read-only view. Update by uploading a new Excel file to GitHub.</footer>

  <script>
    const FILE_URL = 'Museum_Check_List.xlsx';
    let data = null;

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function nsTag(el, name) {
      return el.getElementsByTagNameNS('*', name);
    }

    function colRowFromRef(ref) {
      const m = String(ref).match(/^([A-Z]+)(\d+)$/i);
      if (!m) return { col: 1, row: 1 };
      const letters = m[1].toUpperCase();
      let col = 0;
      for (let i = 0; i < letters.length; i++) col = col * 26 + (letters.charCodeAt(i) - 64);
      return { col, row: parseInt(m[2], 10) };
    }

    function rgbToCss(rgb) {
      if (!rgb) return null;
      rgb = rgb.replace('#', '').toUpperCase();
      if (rgb.length === 8) rgb = rgb.slice(2);
      if (rgb.length !== 6) return null;
      return '#' + rgb;
    }

    function parseFills(stylesXml) {
      const doc = new DOMParser().parseFromString(stylesXml, 'application/xml');
      const fills = [];
      const fillNodes = nsTag(doc, 'fill');
      for (let i = 0; i < fillNodes.length; i++) {
        const pf = nsTag(fillNodes[i], 'patternFill')[0];
        if (!pf) { fills.push(null); continue; }
        const type = pf.getAttribute('patternType');
        if (type !== 'solid') { fills.push(null); continue; }
        const fg = nsTag(pf, 'fgColor')[0];
        fills.push(fg ? rgbToCss(fg.getAttribute('rgb')) : null);
      }
      const xfs = [];
      const xfNodes = nsTag(doc, 'cellXfs')[0] ? nsTag(nsTag(doc, 'cellXfs')[0], 'xf') : [];
      for (let i = 0; i < xfNodes.length; i++) {
        const fillId = parseInt(xfNodes[i].getAttribute('fillId') || '0', 10);
        const applyFill = xfNodes[i].getAttribute('applyFill');
        const color = fills[fillId] || null;
        xfs.push(color);
      }
      return xfs;
    }

    function parseSharedStrings(xml) {
      if (!xml) return [];
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const sis = nsTag(doc, 'si');
      const out = [];
      for (let i = 0; i < sis.length; i++) {
        const texts = nsTag(sis[i], 't');
        let s = '';
        for (let j = 0; j < texts.length; j++) s += texts[j].textContent || '';
        out.push(s);
      }
      return out;
    }

    function parseSheet(xml, shared, xfs) {
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const cells = nsTag(doc, 'c');
      const grid = {};
      let maxRow = 0, maxCol = 0;
      for (let i = 0; i < cells.length; i++) {
        const c = cells[i];
        const ref = c.getAttribute('r');
        if (!ref) continue;
        const { col, row } = colRowFromRef(ref);
        const t = c.getAttribute('t');
        const s = c.getAttribute('s');
        const vNode = nsTag(c, 'v')[0];
        const isNode = nsTag(c, 'is')[0];
        let value = null;
        if (t === 's' && vNode) value = shared[parseInt(vNode.textContent, 10)] ?? '';
        else if (t === 'inlineStr' && isNode) {
          const ts = nsTag(isNode, 't');
          value = Array.from(ts).map(n => n.textContent || '').join('');
        } else if (vNode) value = vNode.textContent;
        const fill = s != null ? (xfs[parseInt(s, 10)] || null) : null;
        if ((value != null && value !== '') || fill) {
          grid[row + ':' + col] = { value, fill };
          if (row > maxRow) maxRow = row;
          if (col > maxCol) maxCol = col;
        }
      }
      return { grid, maxRow, maxCol };
    }

    function sheetToView(parsed) {
      const { grid, maxRow, maxCol } = parsed;
      let headerRow = 3;
      for (let r = 1; r <= Math.min(8, maxRow); r++) {
        const v = (grid[r + ':1'] || {}).value;
        if (v === 'No.') { headerRow = r; break; }
      }
      let lastCol = 3;
      for (let c = 1; c <= maxCol; c++) {
        const v = (grid[headerRow + ':' + c] || {}).value;
        if (v != null && v !== '') lastCol = c;
      }
      const headers = [];
      for (let c = 1; c <= lastCol; c++) {
        const cell = grid[headerRow + ':' + c] || {};
        headers.push({ value: cell.value == null ? '' : cell.value, fill: cell.fill || null });
      }
      const rows = [];
      for (let r = headerRow + 1; r <= maxRow; r++) {
        const cells = [];
        let has = false;
        for (let c = 1; c <= lastCol; c++) {
          const cell = grid[r + ':' + c] || {};
          const value = cell.value == null ? '' : cell.value;
          const fill = cell.fill || null;
          if (value !== '' || fill) has = true;
          cells.push({ value, fill });
        }
        const joined = cells.slice(0, 3).map(x => String(x.value).toLowerCase()).join(' ');
        const isResults = joined.includes('results');
        if (isResults) {
          rows.push({ cells, is_results: true });
          continue;
        }
        if (has && cells[0].value !== '') rows.push({ cells, is_results: false });
      }
      return { headers, rows };
    }

    async function loadExcel() {
      const resp = await fetch(FILE_URL + '?t=' + Date.now());
      if (!resp.ok) throw new Error('Could not load Museum_Check_List.xlsx');
      const buf = await resp.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      const wbXml = await zip.file('xl/workbook.xml').async('string');
      const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
      const stylesXml = await zip.file('xl/styles.xml').async('string');
      const ssFile = zip.file('xl/sharedStrings.xml');
      const shared = ssFile ? parseSharedStrings(await ssFile.async('string')) : [];
      const xfs = parseFills(stylesXml);

      const relDoc = new DOMParser().parseFromString(relsXml, 'application/xml');
      const relMap = {};
      const rels = nsTag(relDoc, 'Relationship');
      for (let i = 0; i < rels.length; i++) {
        relMap[rels[i].getAttribute('Id')] = rels[i].getAttribute('Target');
      }
      const wbDoc = new DOMParser().parseFromString(wbXml, 'application/xml');
      const sheets = nsTag(wbDoc, 'sheet');
      const result = {};
      for (let i = 0; i < sheets.length; i++) {
        const name = sheets[i].getAttribute('name');
        const rid = sheets[i].getAttribute('r:id') || sheets[i].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
        let target = relMap[rid];
        if (!target) continue;
        if (target.startsWith('/')) target = target.slice(1);
        if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\/?/, '');
        const sheetXml = await zip.file(target).async('string');
        result[name] = sheetToView(parseSheet(sheetXml, shared, xfs));
      }
      const lastMod = resp.headers.get('Last-Modified');
      return { result, lastMod };
    }

    function countStatuses(sheet) {
      const counts = { ok: 0, failed: 0, hang: 0, conn: 0, notresp: 0, total: 0 };
      sheet.rows.forEach(row => {
        if (row.is_results) return;
        counts.total++;
        row.cells.forEach((cell, idx) => {
          if (idx < 3 || !cell.fill) return;
          const f = cell.fill.toUpperCase();
          if (f.includes('00B050')) counts.ok++;
          else if (f.includes('FF0000')) counts.failed++;
          else if (f.includes('00B0F0')) counts.hang++;
          else if (f.includes('0070C0')) counts.conn++;
          else if (f.includes('FFC000')) counts.notresp++;
        });
      });
      return counts;
    }

    function renderSummary(sheetName) {
      const sheet = data[sheetName];
      const c = countStatuses(sheet);
      const days = Math.max(0, (sheet.headers.length || 3) - 3);
      document.getElementById('summary').innerHTML =
        card('📋', 'rgba(59,158,255,0.15)', '#60a5fa', 'Exhibits', c.total) +
        card('📅', 'rgba(59,158,255,0.15)', '#60a5fa', 'Days', days) +
        card('✓', 'rgba(34,197,94,0.15)', '#4ade80', 'OK', c.ok) +
        card('✕', 'rgba(239,68,68,0.15)', '#f87171', 'Failed', c.failed) +
        card('!', 'rgba(245,158,11,0.15)', '#fbbf24', 'Issues', c.hang + c.conn + c.notresp);
    }
    function card(icon, bg, color, label, value) {
      return '<div class="summary-card"><div class="icon" style="background:' + bg + ';color:' + color + '">' + icon +
        '</div><div><div class="label">' + label + '</div><div class="value">' + value + '</div></div></div>';
    }

    function renderSheet(sheetName) {
      const sheet = data[sheetName];
      if (!sheet) return;
      renderSummary(sheetName);
      let html = '<div class="table-wrapper"><div class="table-scroll"><table><thead><tr>';
      sheet.headers.forEach(h => {
        let style = h.fill ? 'background:' + h.fill + ';color:#111;font-weight:700;' : '';
        html += '<th style="' + style + '">' + escapeHtml(h.value) + '</th>';
      });
      html += '</tr></thead><tbody>';
      sheet.rows.forEach(row => {
        html += '<tr' + (row.is_results ? ' class="results-row"' : '') + '>';
        row.cells.forEach(cell => {
          let style = cell.fill ? 'background:' + cell.fill + ';color:#111;font-weight:600;' : '';
          html += '<td style="' + style + '">' + escapeHtml(cell.value) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
      document.getElementById('content').innerHTML = html;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.sheet === sheetName);
      });
    }

    async function loadFromGoogle(url) {
      try {
        const resp = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now());
        if (resp.ok) {
          const json = await resp.json();
          return {
            result: json.sheets || json,
            lastMod: json.lastUpdated || null
          };
        }
      } catch (e) {}
      const json = await loadJsonp(url);
      return {
        result: json.sheets || json,
        lastMod: json.lastUpdated || null
      };
    }

    function loadJsonp(url) {
      return new Promise((resolve, reject) => {
        const cbName = 'checklistCb_' + Date.now();
        const timer = setTimeout(() => reject(new Error('Google Sheets timeout')), 20000);
        window[cbName] = function (json) {
          clearTimeout(timer);
          delete window[cbName];
          script.remove();
          resolve(json);
        };
        const script = document.createElement('script');
        script.onerror = function () {
          clearTimeout(timer);
          reject(new Error('Failed to load Google Sheets'));
        };
        const join = url.indexOf('?') >= 0 ? '&' : '?';
        script.src = url + join + 'callback=' + cbName;
        document.body.appendChild(script);
      });
    }

    async function start() {
      try {
        const googleUrl = (window.CHECKLIST_CONFIG && window.CHECKLIST_CONFIG.googleScriptUrl || '').trim();
        let result, lastMod;
        if (googleUrl) {
          ({ result, lastMod } = await loadFromGoogle(googleUrl));
          document.getElementById('last-updated').textContent =
            lastMod ? 'From Google Sheets • ' + new Date(lastMod).toLocaleString() : 'From Google Sheets';
        } else {
          ({ result, lastMod } = await loadExcel());
          document.getElementById('last-updated').textContent =
            lastMod ? 'Last updated: ' + new Date(lastMod).toLocaleString() : 'Loaded from Excel file';
        }
        data = result;
        const tabsEl = document.getElementById('sheet-tabs');
        tabsEl.innerHTML = '';
        const names = Object.keys(data);
        names.forEach((name, i) => {
          const btn = document.createElement('button');
          btn.className = 'tab' + (i === 0 ? ' active' : '');
          btn.textContent = name;
          btn.dataset.sheet = name;
          btn.onclick = () => renderSheet(name);
          tabsEl.appendChild(btn);
        });
        if (names.length) renderSheet(names[0]);
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="error"><strong>Error</strong><br>' + escapeHtml(err.message) + '</div>';
        document.getElementById('last-updated').textContent = 'Failed to load';
      }
    }
    start();
  </script>
</body>
</html>
