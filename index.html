<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum Check List</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --fail: #ef4444;
      --hang: #f59e0b;
      --conn: #a855f7;
      --notresp: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    h1 span { color: var(--accent); }

    .meta {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--card);
      padding: 0.35rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
    }

    .tab {
      padding: 0.5rem 1.25rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .tab.active {
      background: var(--accent);
      color: #0f172a;
    }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot.ok { background: var(--ok); }
    .dot.fail { background: var(--fail); }
    .dot.hang { background: var(--hang); }
    .dot.conn { background: var(--conn); }
    .dot.notresp { background: var(--notresp); }

    .table-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .table-scroll {
      overflow-x: auto;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 900px;
    }

    th, td {
      padding: 0.45rem 0.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid rgba(51, 65, 85, 0.5);
      white-space: nowrap;
    }

    th {
      background: #0f172a;
      color: var(--muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 5;
      background: var(--card);
      text-align: left;
      min-width: 40px;
    }

    th:nth-child(2), td:nth-child(2) {
      position: sticky;
      left: 40px;
      z-index: 5;
      background: var(--card);
      text-align: left;
      min-width: 140px;
      max-width: 180px;
      white-space: normal;
    }

    th:nth-child(3), td:nth-child(3) {
      position: sticky;
      left: 180px;
      z-index: 5;
      background: var(--card);
      text-align: left;
      min-width: 70px;
    }

    th:first-child, th:nth-child(2), th:nth-child(3) {
      background: #0f172a;
      z-index: 15;
    }

    tr:hover td { background: rgba(56, 189, 248, 0.06); }
    tr:hover td:first-child,
    tr:hover td:nth-child(2),
    tr:hover td:nth-child(3) {
      background: #1e293b;
    }

    /* Status cell colors */
    td.status-ok { background: rgba(34, 197, 94, 0.25); color: #4ade80; font-weight: 600; }
    td.status-fail { background: rgba(239, 68, 68, 0.25); color: #f87171; font-weight: 600; }
    td.status-hang { background: rgba(245, 158, 11, 0.25); color: #fbbf24; font-weight: 600; }
    td.status-conn { background: rgba(168, 85, 247, 0.25); color: #c084fc; font-weight: 600; }
    td.status-notresp { background: rgba(100, 116, 139, 0.3); color: #94a3b8; }

    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--fail);
      color: #fca5a5;
      padding: 1rem 1.25rem;
      border-radius: 0.5rem;
      margin: 1rem 0;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.15s;
    }

    .download-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.2rem; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>🏛️ Museum <span>Check List</span></h1>
        <div class="meta" id="last-updated">Loading...</div>
      </div>
      <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
        <div class="tabs" id="sheet-tabs"></div>
        <a class="download-btn" href="Museum_Check_List.xlsx" download>
          ⬇️ Download Excel
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="legend">
      <div class="legend-item"><span class="dot ok"></span> OK</div>
      <div class="legend-item"><span class="dot fail"></span> Failed</div>
      <div class="legend-item"><span class="dot hang"></span> Hang</div>
      <div class="legend-item"><span class="dot conn"></span> Connectivity</div>
      <div class="legend-item"><span class="dot notresp"></span> Not Respond</div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        Loading checklist...
      </div>
    </div>
  </main>

  <footer>
    Read-only view • Data updates when the Excel file is replaced in the repository
  </footer>

  <script>
    const FILE_URL = 'Museum_Check_List.xlsx';
    let workbook = null;
    let currentSheet = null;

    function getStatusClass(val) {
      if (val == null || val === '') return '';
      const v = String(val).trim().toLowerCase();
      if (v === 'ok' || v === 'o' || v === '✓' || v === 'yes') return 'status-ok';
      if (v === 'failed' || v === 'fail' || v === 'f' || v === '×' || v === 'x') return 'status-fail';
      if (v === 'hang' || v === 'h') return 'status-hang';
      if (v === 'connectivity' || v === 'conn' || v === 'c') return 'status-conn';
      if (v === 'not respond' || v === 'notrespond' || v === 'nr' || v === 'n') return 'status-notresp';
      return '';
    }

    function renderSheet(sheetName) {
      currentSheet = sheetName;
      const ws = workbook.Sheets[sheetName];
      if (!ws) return;

      // Convert to array of arrays
      const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      // Find header row (usually row index 2 which is the 3rd row: No. Exhibits Server Address ...)
      let headerRowIdx = 0;
      for (let i = 0; i < Math.min(6, data.length); i++) {
        if (data[i] && data[i][0] === 'No.') {
          headerRowIdx = i;
          break;
        }
      }

      const headers = data[headerRowIdx] || [];
      const rows = data.slice(headerRowIdx + 1).filter(r => r && r[0] !== '' && r[0] != null);

      // Build table
      let html = '<div class="table-wrapper"><div class="table-scroll"><table><thead><tr>';
      headers.forEach((h, idx) => {
        const label = h === '' || h == null ? (idx + 1) : h;
        html += `<th>${escapeHtml(String(label))}</th>`;
      });
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        // Skip completely empty or "Results >" rows
        if (!row[0] && !row[1]) return;
        if (String(row[1] || '').toLowerCase().includes('results')) return;

        html += '<tr>';
        row.forEach((cell, colIdx) => {
          const val = cell == null ? '' : cell;
          let cls = '';
          // Status columns start after the first 3 fixed columns
          if (colIdx >= 3) {
            cls = getStatusClass(val);
          }
          html += `<td class="${cls}">${escapeHtml(String(val))}</td>`;
        });
        // Pad if needed
        for (let i = row.length; i < headers.length; i++) {
          html += '<td></td>';
        }
        html += '</tr>';
      });

      html += '</tbody></table></div></div>';
      document.getElementById('content').innerHTML = html;

      // Update active tab
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.sheet === sheetName);
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadWorkbook() {
      try {
        const resp = await fetch(FILE_URL + '?t=' + Date.now()); // cache bust
        if (!resp.ok) throw new Error('Failed to load Excel file (' + resp.status + ')');
        const ab = await resp.arrayBuffer();
        workbook = XLSX.read(ab, { type: 'array' });

        // Last modified
        const lastMod = resp.headers.get('Last-Modified');
        document.getElementById('last-updated').textContent =
          lastMod ? 'Last updated: ' + new Date(lastMod).toLocaleString() : 'Data loaded';

        // Build tabs
        const tabsEl = document.getElementById('sheet-tabs');
        tabsEl.innerHTML = '';
        workbook.SheetNames.forEach((name, i) => {
          const btn = document.createElement('button');
          btn.className = 'tab' + (i === 0 ? ' active' : '');
          btn.textContent = name;
          btn.dataset.sheet = name;
          btn.onclick = () => renderSheet(name);
          tabsEl.appendChild(btn);
        });

        // Render first sheet
        if (workbook.SheetNames.length > 0) {
          renderSheet(workbook.SheetNames[0]);
        }
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<div class="error"><strong>Error loading checklist</strong><br>${escapeHtml(err.message)}</div>`;
        document.getElementById('last-updated').textContent = 'Failed to load';
      }
    }

    loadWorkbook();
  </script>
</body>
</html>
